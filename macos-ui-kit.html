<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Johnny | Farming</title>
<style>
:root{
  --bg:#0b0d10;--sidebar:#101318;--panel:#15191f;--panel2:#191e25;--stroke:#292f38;
  --text:#f3f5f7;--sub:#a9b0ba;--muted:#707985;--accent:#5b9cff;--accent2:#3478e5;
  --danger:#ff5f57;--success:#33d17a;--shadow:0 24px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:#080a0d;color:var(--text);overflow:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.25}
body:before{width:420px;height:420px;background:#315dba;left:-150px;top:-130px}
body:after{width:360px;height:360px;background:#6c3bbd;right:-120px;bottom:-120px}
button,input{font:inherit}
button{color:inherit}
.app{position:relative;z-index:1;width:min(1080px,96vw);height:min(760px,94vh);margin:3vh auto;background:rgba(13,16,21,.92);border:1px solid #303640;border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.titlebar{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(#191e25,#12161b);border-bottom:1px solid var(--stroke)}
.dots{display:flex;gap:8px}.dot{width:12px;height:12px;border:0;border-radius:50%;padding:0;cursor:pointer}.red{background:#ff5f57}.yellow{background:#f5a623}.green{background:#33d17a}
.title{font-size:13px;font-weight:650}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}.grow{flex:1}
.header-status{font-size:11px;color:var(--muted);padding:5px 9px;border:1px solid var(--stroke);border-radius:6px;background:#11151a}
.body{min-height:0;flex:1;display:flex}
.sidebar{width:224px;flex:0 0 224px;background:rgba(12,15,19,.94);border-right:1px solid var(--stroke);padding:10px 8px;display:flex;flex-direction:column;min-height:0}
.search{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;margin-bottom:9px;border:1px solid var(--stroke);border-radius:7px;background:#151a20;color:var(--muted)}
.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}.search input::placeholder{color:#69717c}
.nav-scroll{min-height:0;overflow-y:auto;padding-right:2px}.nav-scroll::-webkit-scrollbar,.content::-webkit-scrollbar{width:7px}.nav-scroll::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb{background:#303640;border-radius:8px}
.nav{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;margin:2px 0;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--sub);cursor:pointer;text-align:left;transition:.16s}
.nav:hover{background:#191e25;color:#fff}.nav.active{background:linear-gradient(90deg,rgba(91,156,255,.22),rgba(91,156,255,.07));border-color:#314c72;color:#fff}
.nav .ico{width:18px;text-align:center;font-size:14px;color:#dce4ef;font-weight:700}
.content{min-width:0;min-height:0;flex:1;overflow-y:auto;padding:24px 28px 32px}
.page-head{margin-bottom:18px}.page-head h1{font-size:18px;margin:0 0 4px}.page-head p{font-size:12px;color:var(--muted);margin:0}
.section{border:1px solid var(--stroke);background:linear-gradient(180deg,#171c22,#13171c);border-radius:8px;margin-bottom:10px;overflow:hidden}
.section-head{padding:12px 14px;border-bottom:1px solid var(--stroke);font-size:13px;font-weight:650}
.section-body{padding:6px 14px 12px}
.row{min-height:52px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #232932}.row:last-child{border-bottom:0}
.row-copy{min-width:0;flex:1}.row-title{font-size:13px;color:var(--text)}.row-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
.control{flex:0 0 auto}
.toggle{width:38px;height:21px;border-radius:12px;border:1px solid #343b45;background:#252b33;position:relative;cursor:pointer;transition:.2s}
.toggle:after{content:"";position:absolute;width:15px;height:15px;top:2px;left:2px;border-radius:50%;background:#dce1e8;transition:.2s;box-shadow:0 1px 3px #000}
.toggle.on{background:var(--accent2);border-color:var(--accent)}.toggle.on:after{left:19px}
.btn{border:1px solid #39414c;background:#20262e;border-radius:6px;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}.btn:hover{background:#29313b}.btn.primary{background:linear-gradient(#5f9fff,#367ce6);border-color:#6ca7ff}.btn.danger{background:#3a1d20;border-color:#6b3034;color:#ffaaa5}
.input{width:150px;border:1px solid #39414c;border-radius:6px;background:#11151a;color:var(--text);outline:0;padding:7px 9px;font-size:11px}.input:focus{border-color:#568fe7}
.select{width:170px;border:1px solid #39414c;border-radius:6px;background:#11151a;color:var(--text);padding:7px 9px;font-size:11px;outline:0}
.slider{width:170px;accent-color:var(--accent)}
.badge{font-size:10px;color:#aeb8c5;border:1px solid #343b45;background:#11151a;border-radius:5px;padding:4px 7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{padding:12px;border:1px solid var(--stroke);border-radius:8px;background:#151a20}.stat .k{font-size:10px;color:var(--muted)}.stat .v{font-size:17px;font-weight:700;margin-top:5px}
.notice{padding:10px 12px;border:1px solid #31415a;background:#121a27;border-radius:7px;color:#aebbd0;font-size:11px;line-height:1.5;margin-bottom:10px}
.tabs-empty{padding:25px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:760px){.app{width:100vw;height:100vh;margin:0;border-radius:0}.sidebar{width:190px;flex-basis:190px}.content{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="titlebar">
    <div class="dots"><button class="dot red" id="closeBtn" aria-label="Close"></button><button class="dot yellow" id="minBtn" aria-label="Minimize"></button><button class="dot green" id="maxBtn" aria-label="Maximize"></button></div>
    <div><div class="title">Johnny | Farming</div><div class="subtitle">Fluent-style control panel</div></div>
    <div class="grow"></div><div class="header-status" id="saveState">Ready</div>
  </header>
  <div class="body">
    <aside class="sidebar">
      <div class="search">⌕ <input id="navSearch" placeholder="Search tabs"></div>
      <div class="nav-scroll" id="nav"></div>
    </aside>
    <main class="content" id="content"></main>
  </div>
</div>
<script>
const pages=[
 {id:'main',name:'Main',icon:'M',desc:'Player settings and core utilities'},
 {id:'fastfarm',name:'Fast Farm',icon:'F',desc:'Fast farming, ping control and exercise automation'},
 {id:'fastrebirth',name:'Fast Rebirth',icon:'R',desc:'Rebirth timing, pace and protected pet handling'},
 {id:'rebirth',name:'Rebirth',icon:'B',desc:'Rebirth automation and target controls'},
 {id:'tools',name:'Tools',icon:'T',desc:'Fast tools and gym teleports'},
 {id:'info',name:'Info',icon:'I',desc:'Script information and cleanup'},
 {id:'admin',name:'Admin',icon:'A',desc:'Execution dashboard and access control'}
];

const state={
 toggles:{},values:{repSpeed:'1',pausePing:'250',resumePing:'200',pauseDuration:'1',speed:'16',size:'1',rebirthTarget:''},
 tab:'main', destroyed:false, maximized:false
};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setStatus(t){document.getElementById('saveState').textContent=t}
function row(title,desc,control){return '<div class="row"><div class="row-copy"><div class="row-title">'+esc(title)+'</div>'+(desc?'<div class="row-desc">'+esc(desc)+'</div>':'')+'</div><div class="control">'+control+'</div></div>'}
function toggle(key,on=false){const active=state.toggles[key]??on;return '<button class="toggle '+(active?'on':'')+'" data-toggle="'+esc(key)+'" aria-label="'+esc(key)+'"></button>'}
function button(key,label,kind=''){return '<button class="btn '+kind+'" data-action="'+esc(key)+'">'+esc(label)+'</button>'}
function input(key,value,placeholder=''){return '<input class="input" data-input="'+esc(key)+'" value="'+esc(value??'')+'" placeholder="'+esc(placeholder)+'">'}
function section(title,body){return '<section class="section"><div class="section-head">'+esc(title)+'</div><div class="section-body">'+body+'</div></section>'}
function render(){
 const p=pages.find(x=>x.id===state.tab)||pages[0];
 document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.id===p.id));
 let body='';
 if(p.id==='main')body=renderMain();
 if(p.id==='fastfarm')body=renderFastFarm();
 if(p.id==='fastrebirth')body=renderFastRebirth();
 if(p.id==='rebirth')body=renderRebirth();
 if(p.id==='tools')body=renderTools();
 if(p.id==='info')body=renderInfo();
 if(p.id==='admin')body=renderAdmin();
 document.getElementById('content').innerHTML='<div class="page-head"><h1>'+esc(p.name)+'</h1><p>'+esc(p.desc)+'</p></div>'+body;
}
function renderMain(){
 return section('Settings',
 row('Speed','Set the player WalkSpeed value.',input('speed',state.values.speed,'16'))+
 row('Size','Set the requested player size value.',input('size',state.values.size,'1'))+
 row('Auto Speed','Keep the configured speed enabled.',toggle('autoSpeed'))+
 row('Auto Size','Keep the configured size enabled.',toggle('autoSize')))+
 section('Player Utilities',
 row('Auto Teleport to Muscle King','Continuously maintain the Muscle King position.',toggle('muscleKingTP'))+
 row('Position Lock','Keep the configured position while enabled.',toggle('positionLock')));
}
function renderFastFarm(){
 return section('Fast Farm',
 row('Rep Speed','Fast Farm recommended speed: 20.',input('repSpeed',state.values.repSpeed,'1'))+
 row('Fast Farm','Start the fast rep loop.',toggle('fastRep')))+
 section('Ping Adjuster',
 row('Ping Adjuster','Pause the fast loop when latency reaches the configured threshold.',toggle('pingAdjuster',true))+
 row('Pause At Ping (ms)','Pause at or above this ping.',input('pausePing',state.values.pausePing,'250'))+
 row('Resume Below Ping (ms)','Resume after ping drops below this value.',input('resumePing',state.values.resumePing,'200'))+
 row('Pause Duration (seconds)','Cooldown before checking recovery again.',input('pauseDuration',state.values.pauseDuration,'1'))+
 row('Current Status','Live UI status.', '<span class="badge" id="pingStatus">Ready</span>'))+
 section('Automatic Exercise',
 row('Punch','Automatically repeat Punch reps.',toggle('exercisePunch'))+
 row('Weight','Automatically repeat Weight reps.',toggle('exerciseWeight'))+
 row('Pushups','Automatically repeat Pushups reps.',toggle('exercisePushups'))+
 row('Handstands','Automatically repeat Handstands reps.',toggle('exerciseHandstands'))+
 row('Situps','Automatically repeat Situps reps.',toggle('exerciseSitups')));
}
function renderFastRebirth(){
 return section('Fast Rebirth',
 row('Fast Rebirth','Run the rebirth loop while tracking pace.',toggle('fastRebirth'))+
 row('Time','Elapsed runtime and activity state.','<span class="badge" id="rebTime">0d 0h 0m 0s - Inactive</span>')+
 row('Pace','Current calculated pace.','<span class="badge" id="rebPace">0 / Hour | 0 / Day | 0 / Week</span>')+
 row('Average Pace','Rolling average pace.','<span class="badge" id="rebAvg">0 / Hour | 0 / Day | 0 / Week</span>')+
 row('Rebirths','Current total and session gain.','<span class="badge" id="rebStats">Rebirths: 0 | Gained: 0</span>'))+
 section('Pet Management',
 row('Titanium Hydra Protection','Titanium Hydra stays equipped and is never selected for removal.',toggle('protectHydra',true))+
 row('Swift Samurai','Manage the x2 rebirth pet without removing protected pets.',button('equipSwift','Equip Swift Samurai'))+
 row('Pet Slots','Supports the expanded 12-slot setup.','<span class="badge">12 slots</span>'));
}
function renderRebirth(){
 return section('Rebirth Controls',
 row('Target Rebirth','Enable target-based rebirth automation.',toggle('targetRebirth'))+
 row('Target Value','Set the target rebirth amount.',input('rebirthTarget',state.values.rebirthTarget,'Target'))+
 row('Infinite Rebirth','Run continuous rebirth automation.',toggle('infiniteRebirth'))+
 row('Rebirth Status','Current state.','<span class="badge" id="rebirthStatus">Inactive</span>'));
}
function renderTools(){
 return section('Fast Tools',
 row('Fast Tools','Set configured tool attack/rep timing to the fast values.',toggle('fastTools'))+
 row('Punch','Tool timing target.','<span class="badge">0 / 0.35</span>')+
 row('Ground Slam','Tool timing target.','<span class="badge">0 / 6</span>')+
 row('Stomp','Tool timing target.','<span class="badge">0 / 7</span>')+
 row('Handstands / Pushups / Weight / Situps','Rep timing target.','<span class="badge">0 / 1</span>'))+
 section('Gym Teleports',
 row('Jungle Bench Press','Teleport to the saved location.',button('tpBench','Teleport'))+
 row('Jungle Pull Ups','Teleport to the saved location.',button('tpPull','Teleport'))+
 row('Jungle Boulder','Teleport to the saved location.',button('tpBoulder','Teleport'))+
 row('Medieval Gym Super Squat','Teleport to the saved location.',button('tpSquat','Teleport')));
}
function renderInfo(){
 return section('Script Information',
 row('Author','Original script information.','<span class="badge">Johnny</span>')+
 row('Discord','Original community link.','<span class="badge">discord.gg/Muscle</span>')+
 row('Version','Original version label.','<span class="badge">VERSION:1.1</span>'))+
 section('Cleanup',
 row('Destroy Script + Anti AFK','Stop the script and its active loops.',button('destroy','Destroy','danger'))+
 row('Copy Invite','Copy the original Discord invite when clipboard support is available.',button('copyInvite','Copy Invite')));
}
function renderAdmin(){
 return section('Admin Access',
 row('Authentication','Local password gate from the original admin page.',input('adminPassword','','Password'))+
 row('Unlock','Open the execution dashboard.',button('unlockAdmin','Unlock','primary'))+
 row('Status','Current access state.','<span class="badge" id="adminStatus">Locked</span>'))+
 section('Global Current Executions',
 '<div id="executionList"><div class="tabs-empty">No execution records loaded.</div></div>');
}
function buildNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=pages.map(p=>'<button class="nav '+(p.id===state.tab?'active':'')+'" data-page="'+p.id+'"><span class="ico">'+p.icon+'</span><span>'+esc(p.name)+'</span></button>').join('');
}
document.getElementById('nav').addEventListener('click',e=>{
 const n=e.target.closest('.nav');if(!n)return;state.tab=n.dataset.page;render();
});
document.getElementById('content').addEventListener('click',e=>{
 const t=e.target.closest('[data-toggle]');
 if(t){const k=t.dataset.toggle;state.toggles[k]=!(state.toggles[k]??false);render();setStatus(k+': '+(state.toggles[k]?'On':'Off'));return}
 const a=e.target.closest('[data-action]');if(!a)return;
 handleAction(a.dataset.action);
});
document.getElementById('content').addEventListener('input',e=>{
 if(!e.target.dataset.input)return;
 state.values[e.target.dataset.input]=e.target.value;
});
function handleAction(a){
 if(a==='destroy'){state.destroyed=true;Object.keys(state.toggles).forEach(k=>state.toggles[k]=false);setStatus('Stopped');render();return}
 if(a==='copyInvite'){navigator.clipboard?.writeText('https://discord.gg/Muscle').then(()=>setStatus('Invite copied')).catch(()=>setStatus('Clipboard unavailable'));return}
 if(a==='unlockAdmin'){
   const pw=state.values.adminPassword||'';
   const status=document.getElementById('adminStatus');
   if(pw==='yader45'){status.textContent='Unlocked';setStatus('Admin unlocked')}else{status.textContent='Incorrect password';setStatus('Access denied')}
   return;
 }
 if(a.startsWith('tp')){setStatus('Teleport requested: '+a);return}
 if(a==='equipSwift'){setStatus('Swift Samurai requested; Titanium Hydra remains protected');return}
 setStatus(a+' requested');
}
function tickUI(){
 if(state.tab==='fastrebirth' && state.toggles.fastRebirth){
   const started=state._rebStart||(state._rebStart=Date.now());
   const sec=Math.floor((Date.now()-started)/1000),d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
   const el=document.getElementById('rebTime');if(el)el.textContent=d+'d '+h+'h '+m+'m '+s+'s - Running';
 }
 requestAnimationFrame(tickUI);
}
document.getElementById('navSearch').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('hidden',!n.textContent.toLowerCase().includes(q)));
});
document.getElementById('minBtn').onclick=()=>{document.getElementById('app').style.height=document.getElementById('app').style.height?'':'min(760px,94vh)';document.getElementById('app').classList.toggle('minimized')};
document.getElementById('maxBtn').onclick=()=>{state.maximized=!state.maximized;const a=document.getElementById('app');a.style.width=state.maximized?'98vw':'min(1080px,96vw)';a.style.height=state.maximized?'96vh':'min(760px,94vh)'};
document.getElementById('closeBtn').onclick=()=>{document.getElementById('app').style.display='none'};
buildNav();render();tickUI();
</script>
</body>
</html>
